async function showFileModal(path, opts = {}) {
  const modal = document.getElementById('fileModal');
  const wasOpen = !modal.hidden;
  if (!opts.back) {
    if (wasOpen && fileNav.cur) fileNav.stack.push(fileNav.cur);
    else if (!wasOpen) fileNav.stack = [];
  }
  fileNav.cur = { path, line: opts.line || 0 };
  updateBackBtn();
  document.getElementById('fileModalTitle').textContent = path;
  const { reverse, forward } = buildRelationIndex();
  const rev = reverse[path] || [];
  const fwd = forward[path] || [];
  const refsEl = document.getElementById('fileModalRefs');
  const chips = [];
  if (rev.length) {
    chips.push('<span class="small" style="color:var(--m)">Referenced by:</span>');
    for (const r of rev) {
      chips.push(`<button class="rel-chip" data-relatedpath="${esc(r.path)}">
        <span class="rel-name">${esc(r.name)}</span>
        <span class="badge parsed">${esc(r.kind.replace(/s$/, ''))}</span>
      </button>`);
    }
  }
  if (fwd.length) {
    chips.push('<span class="small" style="color:var(--m); margin-left:8px">Relates to:</span>');
    for (const r of fwd) {
      chips.push(`<button class="rel-chip" data-relatedpath="${esc(r.path)}">
        <span class="rel-name">${esc(r.path.split('/').pop())}</span>
        <span class="badge link">${esc(r.kind)}</span>
      </button>`);
    }
  }
  if (chips.length) { refsEl.style.display = ''; refsEl.innerHTML = chips.join(' '); }
  else refsEl.style.display = 'none';

  const gotoBtn = document.getElementById('fileModalGoto');
  const classified = findEntryByPath(path);
  if (classified) {
    gotoBtn.style.display = '';
    gotoBtn.onclick = () => { tab = classified.tab; sel = classified.index; modal.hidden = true; draw(); };
  } else {
    gotoBtn.style.display = 'none'; gotoBtn.onclick = null;
  }

  const host = document.getElementById('fileModalViewerHost');
  host.innerHTML = makeViewerHTML(path);
  modal.hidden = false;
  const viewerEl = host.querySelector('.code-viewer');
  await loadSourceIntoViewer(viewerEl);
  if (opts.line) gotoLine(viewerEl, opts.line);
}

/* ============================================================
   TEXTURE MODAL + ANIMATION (mcmeta-aware, cache-only)
   ============================================================ */
let texSpeed = 1;
let texState = null;
let texLoadToken = 0;

function texDisplayDims() {
  const st = texState;
  if (!st || st.gif) return [texNaturalW, texNaturalH];
  return st.strip ? [st.img.naturalWidth, st.img.naturalHeight] : [st.fw, st.fh];
}
function sizeTexCanvas() {
  const cv = document.getElementById('textureModalCanvas');
  const [w, h] = texDisplayDims();
  if (cv.width !== w) cv.width = w;
  if (cv.height !== h) cv.height = h;
}
function drawTexFrame() {
  const st = texState;
  if (!st || st.gif) return;
  const cv = document.getElementById('textureModalCanvas');
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (st.strip || st.frames <= 1) {
    ctx.drawImage(st.img, 0, 0);
  } else {
    const sheetFrame = st.frameOrder[st.frameIdx];
    ctx.drawImage(st.img, 0, sheetFrame * st.fw, st.fw, st.fw, 0, 0, st.fw, st.fw);
  }
}
function updateTexInfo() {
  const st = texState;
  const info = document.getElementById('texFrameInfo');
  if (!st || st.frames <= 1) { info.textContent = ''; return; }
  const ms = frameDurationMs(st.frametime, texSpeed);
  const fps = 1000 / ms;
  const fpsTxt = (fps < 10 ? fps.toFixed(1) : Math.round(fps)) + ' fps';
  const ftTxt = `frametime ${st.frametime} tick${st.frametime === 1 ? '' : 's'}${st.mcmetaSource ? '' : ' (default)'}`;
  info.textContent = st.strip
    ? `${st.frames} frame${st.frames === 1 ? '' : 's'} · ${ftTxt}`
    : `frame ${st.frameIdx + 1} / ${st.frames} · ${ftTxt} · ${fpsTxt}`;
  const play = document.getElementById('texPlay');
  play.textContent = st.playing ? '⏸ Pause' : '▶ Play';
  play.classList.toggle('on', st.playing);
  document.getElementById('texStrip').classList.toggle('on', st.strip);
  document.getElementById('texStrip').textContent = st.strip ? 'Animate' : 'Show strip';
}

function applyTextureZoom() {
  const cv = document.getElementById('textureModalCanvas');
  const img = document.getElementById('textureModalImg');
  const wrap = document.getElementById('textureModalImgWrap');
  if (!cv || !wrap) return;
  const el = (texState && texState.gif) ? img : cv;
  const [dw, dh] = texDisplayDims();
  let scale;
  if (texZoomMode === 'fit') {
    const cw = wrap.clientWidth || 1, ch = wrap.clientHeight || 1;
    scale = Math.min(cw / dw, ch / dh);
    if (scale >= 1) scale = Math.floor(scale);
  } else {
    scale = parseInt(texZoomMode, 10) || 1;
  }
  el.style.width  = Math.max(1, Math.floor(dw * scale)) + 'px';
  el.style.height = Math.max(1, Math.floor(dh * scale)) + 'px';
  document.querySelectorAll('#textureModalZoomBar button').forEach(b => {
    b.classList.toggle('on', b.dataset.texzoom === texZoomMode);
  });
}

function openTextureModal(path) {
  const modal = document.getElementById('textureModal');
  const item = textureIndex && textureIndex.all.find(x => x.path === path);
  document.getElementById('textureModalTitle').textContent =
    item ? `${item.basename}.${item.ext}` : path.split('/').pop();

  const cv = document.getElementById('textureModalCanvas');
  const img = document.getElementById('textureModalImg');
  const dimsEl = document.getElementById('textureModalDims');
  const bar = document.getElementById('textureModalAnimBar');
  const token = ++texLoadToken;
  const isGif = /\.gif$/i.test(path);

  texState = null;
  texNaturalW = 16; texNaturalH = 16;
  dimsEl.textContent = '';
  bar.hidden = true;
  cv.hidden = false; img.hidden = true;
  cv.width = 16; cv.height = 16;
  cv.getContext('2d').clearRect(0, 0, 16, 16);

  // mcmeta is read from the cache only — no GitHub request at this point.
  const mcmetaPromise = getMcmeta(path);

  const loader = new Image();
  loader.onload = async () => {
    if (token !== texLoadToken) return;
    const w = loader.naturalWidth || 16, h = loader.naturalHeight || 16;
    texNaturalW = w; texNaturalH = h;
    if (isGif) {
      texState = { gif: true, frames: 1 };
      img.src = loader.src; img.hidden = false; cv.hidden = true;
      dimsEl.textContent = `${w}×${h} (GIF, browser-played)`;
      applyTextureZoom();
      return;
    }
    const sheetFrames = (h > w && h % w === 0) ? h / w : 1;
    const defaultOrder = Array.from({ length: sheetFrames }, (_, i) => i);
    // Set up the state with defaults so we can start animating immediately.
    texState = {
      img: loader,
      sheetFrames,
      frameOrder: defaultOrder,
      frames: defaultOrder.length,
      fw: w,
      fh: sheetFrames > 1 ? w : h,
      frametime: 1,
      mcmetaSource: false,
      frameIdx: 0,
      last: performance.now(),
      playing: true,
      strip: false,
    };
    sizeTexCanvas(); drawTexFrame();
    bar.hidden = sheetFrames <= 1;
    updateTexInfo();
    dimsEl.textContent = sheetFrames > 1 ? `${w}×${h} · ${sheetFrames} frames` : `${w}×${h}`;
    applyTextureZoom();

    // Upgrade to mcmeta values when available (this is an in-memory
    // promise — it resolves on the next microtask because the mcmeta
    // is already cached).
    if (sheetFrames > 1 && textureIndex && textureIndex.mcmetaSet.has(path + '.mcmeta')) {
      const mc = await withTimeout(mcmetaPromise, 200, null);
      if (token !== texLoadToken || !texState) return;
      if (mc) {
        const newOrder = buildFrameOrder(sheetFrames, mc);
        texState.frameOrder = newOrder;
        texState.frames = newOrder.length;
        texState.frametime = mc.frametime;
        texState.mcmetaSource = true;
        texState.frameIdx = Math.min(texState.frameIdx, newOrder.length - 1);
        texState.last = performance.now();
        updateTexInfo();
        dimsEl.textContent = `${w}×${h} · ${newOrder.length} frame${newOrder.length === 1 ? '' : 's'} · frametime ${mc.frametime} tick${mc.frametime === 1 ? '' : 's'}`;
      }
    }
  };
  loader.onerror = () => {
    if (token !== texLoadToken) return;
    dimsEl.textContent = 'failed to load';
    applyTextureZoom();
  };
  loader.src = rawUrl(path);

  document.getElementById('textureModalPath').textContent = path;
  document.getElementById('textureModalCopyUrl').onclick = () => {
    navigator.clipboard.writeText(rawUrl(path))
      .then(() => log('Texture URL copied.', 'ok'))
      .catch(err => log('Copy failed: ' + err.message, 'err'));
  };
  document.getElementById('textureModalCopyPath').onclick = () => {
    navigator.clipboard.writeText(path)
      .then(() => log('Texture path copied.', 'ok'))
      .catch(err => log('Copy failed: ' + err.message, 'err'));
  };

  modal.hidden = false;
  applyTextureZoom();
}

document.querySelectorAll('#textureModalZoomBar button').forEach(b => {
  b.addEventListener('click', () => {
    texZoomMode = b.dataset.texzoom;
    applyTextureZoom();
  });
});
document.getElementById('texPlay').addEventListener('click', () => {
  if (!texState || texState.frames <= 1) return;
  texState.playing = !texState.playing;
  texState.last = performance.now();
  updateTexInfo();
});
function texStep(d) {
  const st = texState;
  if (!st || st.frames <= 1 || st.strip) return;
  st.playing = false;
  st.frameIdx = (st.frameIdx + d + st.frames) % st.frames;
  drawTexFrame(); updateTexInfo();
}
document.getElementById('texPrev').addEventListener('click', () => texStep(-1));
document.getElementById('texNext').addEventListener('click', () => texStep(1));
document.getElementById('texStrip').addEventListener('click', () => {
  if (!texState || texState.frames <= 1) return;
  texState.strip = !texState.strip;
  sizeTexCanvas(); drawTexFrame(); updateTexInfo(); applyTextureZoom();
});
document.getElementById('texSpeed').addEventListener('change', e => {
  texSpeed = parseFloat(e.target.value) || 1;
  if (texState) texState.last = performance.now();
  updateTexInfo();
});
window.addEventListener('resize', () => {
  const m = document.getElementById('textureModal');
  if (m && !m.hidden) applyTextureZoom();
});

/* ----- animated thumbnails (grid, entry pages, search) + modal clock ----- */
const animThumbs = new Set();
const thumbIO = ('IntersectionObserver' in window)
  ? new IntersectionObserver(entries => {
      for (const en of entries) { if (en.isIntersecting) animThumbs.add(en.target); else animThumbs.delete(en.target); }
    })
  : null;
function upgradeThumb(img) {
  if (img.dataset.anim) return;
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || h <= w || h % w || /\.gif(\?|$)/i.test(img.currentSrc || img.src)) return;
  const sheetFrames = h / w;
  // Use cached mcmeta when available. The mcmeta was prefetched during
  // explore, so this is a pure in-memory read — no GitHub request.
  let frametime = 1, frameOrder = null, fromMcmeta = false;
  const repoPath = img.dataset.repoPath || '';
  if (repoPath && textureIndex && textureIndex.mcmetaSet) {
    const mcPath = repoPath + '.mcmeta';
    if (files[mcPath]) {
      const mc = parseMcmeta(files[mcPath]);
      if (mc) {
        frametime = mc.frametime;
        frameOrder = buildFrameOrder(sheetFrames, mc);
        fromMcmeta = true;
      }
    }
  }
  if (!frameOrder) frameOrder = Array.from({ length: sheetFrames }, (_, i) => i);

  img.dataset.anim = '1';
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = w;
  cv.className = img.className;
  cv.title = img.parentElement ? (img.parentElement.title || '') : '';
  cv._src = img;
  cv._frameOrder = frameOrder;
  cv._frames = frameOrder.length;
  cv._frameDur = frameDurationMs(frametime);
  cv._w = w;
  cv._f = -1;
  cv._mcmeta = fromMcmeta;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const f0 = frameOrder[0];
  ctx.drawImage(img, 0, f0 * w, w, w, 0, 0, w, w);
  cv._f = 0;
  img.replaceWith(cv);
  if (thumbIO) thumbIO.observe(cv); else animThumbs.add(cv);
}
document.addEventListener('load', e => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && (t.classList.contains('gs-thumb') || t.closest('.texture-thumb'))) upgradeThumb(t);
}, true);

function animTick(t) {
  for (const cv of animThumbs) {
    if (!cv.isConnected) { animThumbs.delete(cv); continue; }
    const f = Math.floor(t / cv._frameDur) % cv._frames;
    if (f === cv._f) continue;
    cv._f = f;
    const sheetFrame = cv._frameOrder[f];
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv._w, cv._w);
    ctx.drawImage(cv._src, 0, sheetFrame * cv._w, cv._w, cv._w, 0, 0, cv._w, cv._w);
  }
  const st = texState, tm = document.getElementById('textureModal');
  if (st && !st.gif && st.frames > 1 && st.playing && !st.strip && tm && !tm.hidden) {
    const ms = frameDurationMs(st.frametime, texSpeed);
    const steps = Math.floor((t - st.last) / ms);
    if (steps > 0) {
      st.last += steps * ms;
      st.frameIdx = (st.frameIdx + steps) % st.frames;
      drawTexFrame(); updateTexInfo();
    }
  }
  requestAnimationFrame(animTick);
}
requestAnimationFrame(animTick);

function draw() {
  const side = $('#side'), form = $('#form');
  if (!side || !form) return;

  const tabButtons = Object.entries(TABS).map(([k, v]) =>
    `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${v}</button>`
  ).join('');

  if (SIDEBAR_LIST_TABS.includes(tab) && Array.isArray(S[tab])) {

      '<hr style="border-color:var(--b);margin:8px 0;">' +
      sideSearchHTML(tab, S[tab].length) +
      sortBarHTML() +
      '<div id="sideList">' + renderSidebarList(S[tab]) + '</div>';
    bindSidebarSearch(side);
  } else {
    side.innerHTML = tabButtons;
  }

  if (tab === 'overview') { drawOverview(form); return; }
  if (tab === 'export')   { drawExport(form); return; }
  if (tab === 'raw')      { drawRaw(form); bindListFilter(form, 'raw'); return; }
  if (tab === 'mixins')   { drawMixins(form); bindListFilter(form, 'mixins'); return; }
  if (tab === 'ieeps')    { drawIEEPs(form); bindListFilter(form, 'ieeps'); return; }
  if (tab === 'textures') { drawTextures(form); return; }

  const arr = S[tab];
  if (!arr || !arr.length) {
    form.innerHTML = `<p class="note">Nothing parsed in <b>${TABS[tab]}</b>. Check <b>Raw / Unparsed</b>.</p>`;
    return;
  }
  const o = arr[sel];
  if (!o) { sel = 0; draw(); return; }

  let h = `<h3>${esc(o.name || o.className || 'Item')} <span class="badge ${o.parsed ? 'parsed' : 'raw'}">${o.parsed ? 'parsed' : 'raw'}</span> <button class="del" data-act="del" style="float:right">Delete</button></h3>`;
  h += `<p class="src">${esc(o.sourcePath || '')}</p>`;

  if (tab === 'blocks') {
    h += `<div class="g">${fld('Name','name',o.name||'')}${fld('Registry name','registryName',o.registryName||'')}${fld('Material','material',o.material||'rock')}${fld('Hardness','hardness',o.hardness ?? 0,'number')}${fld('Resistance','resistance',o.resistance ?? 0,'number')}${fld('Harvest tool','harvestTool',o.harvestTool||'','select',['','pickaxe','axe','shovel'])}${fld('Harvest level','harvestLevel',o.harvestLevel ?? 0,'number')}</div>`;
  }
  if (tab === 'tes') {
    h += `<div class="g">${fld('Name','name',o.name||'')}${fld('Class','className',o.className||'')}${fld('Package','package',o.package||'')}${fld('Slots','slots',o.slots ?? 0,'number')}</div>${fld('Has GUI','gui',!!o.gui,'check')}`;
  }
  if (tab === 'items') {
    h += `<div class="g">${fld('Name','name',o.name||'')}${fld('Registry name','registryName',o.registryName||'')}${fld('Max stack','maxStack',o.maxStack ?? 64,'number')}</div>`;
  }
  if (tab === 'ents') {
    h += `<div class="g">${fld('Name','name',o.name||'')}${fld('Class','className',o.className||'')}${fld('Registry name','registryName',o.registryName||'')}${fld('Health','hp',o.hp ?? 0,'number')}${fld('Speed','spd',o.spd ?? 0,'number')}</div>`;
  }

  h += `<div class="textures-section">${renderTexturesSection(o, tab)}</div>`;

  if (o.relatedFiles && o.relatedFiles.length) {
    h += `<h3>Related files (${o.relatedFiles.length})</h3>
      <div class="relations">${
        o.relatedFiles.map(r => {
          const found = findEntryByPath(r.path);
          const badgeClass = found ? 'parsed' : 'raw';
          return `<button class="rel-chip" data-relatedpath="${esc(r.path)}" title="${esc(r.path)}">

function fld(label, key, value, type = 'text', opts = []) {
  if (type === 'check') return `<label class="c"><input type="checkbox" data-k="${key}" ${value ? 'checked' : ''}> ${label}</label>`;
  if (type === 'select') return `<label>${label}<select data-k="${key}">${opts.map(x => {
    const [a, b] = Array.isArray(x) ? x : [x, x];
    return `<option value="${esc(a)}" ${a == value ? 'selected' : ''}>${esc(b)}</option>`;
  }).join('')}</select></label>`;
  if (type === 'area') return `<label>${label}<textarea data-k="${key}" rows="${opts || 6}" spellcheck="false">${esc(value)}</textarea></label>`;
  return `<label>${label}<input data-k="${key}" type="${type}" value="${esc(value)}" step="any"></label>`;
}

function drawTextures(f) {
  if (!textureIndex || !textureIndex.all.length) {
    f.innerHTML = `<p class="note">No textures found. Explore a repository that contains assets/textures/*.png.</p>`;
    return;
  }
  const q = textureSearch.toLowerCase().trim();
  const groups = {};
  for (const item of textureIndex.all) {
    if (textureFolderFilter !== 'all' && item.folder !== textureFolderFilter) continue;
    if (q && !item.basename.toLowerCase().includes(q) && !item.path.toLowerCase().includes(q)) continue;
    (groups[item.folder] = groups[item.folder] || []).push(item);
  }
  const folders = Object.keys(groups).sort();
  const total = folders.reduce((n, k) => n + groups[k].length, 0);
  const folderOptions = ['all', ...Object.keys(textureIndex.byFolder).sort()];

  f.innerHTML = `
    <h3>Textures (${total} shown, ${textureIndex.all.length} total)</h3>
    <div class="row" style="margin-bottom: 12px">
      <input type="text" id="textureSearch" placeholder="Search by name or path…" value="${esc(textureSearch)}" style="flex:1">
      <select id="textureFolderFilter">
        ${folderOptions.map(fo => `<option value="${esc(fo)}" ${fo === textureFolderFilter ? 'selected' : ''}>${esc(fo === 'all' ? 'All folders' : fo)} (${(textureIndex.byFolder[fo] || []).length})</option>`).join('')}

      <h4 style="margin:12px 0 6px;font-size:13px">${esc(fo)} <span class="small" style="color:var(--m);font-weight:normal">(${groups[fo].length})</span></h4>

  if (filterSelect) {
    filterSelect.addEventListener('change', e => {
      textureFolderFilter = e.target.value;
      drawTextures(f);
    });
  }

/* ============================================================
   SEARCH  (per-category filters + global search)
   ============================================================ */
const catSearch = { blocks:'', tes:'', items:'', ents:'', mixins:'', ieeps:'', raw:'' };
const CAT_NOUN = { blocks:'blocks', tes:'tile entities', items:'items', ents:'entities',
                   mixins:'mixins / core', ieeps:'IEEP', raw:'raw files' };

function entryHaystack(o) {
  if (!o) return '';
  return [o.name, o.className, o.registryName, o.package, o.sourcePath, o.path, o.note]
    .filter(Boolean).join(' ').toLowerCase();
}
function queryTerms(q) { return String(q || '').toLowerCase().split(/\s+/).filter(Boolean); }
function matchQuery(hay, q) {
  const terms = queryTerms(q);
  return terms.every(t => hay.includes(t));
}
function hl(text, terms) {
  const str = String(text ?? '');
  if (!terms.length) return esc(str);
  const re = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'ig');
  return str.split(re).map((part, i) => i % 2 ? '<mark class="gs-hl">' + esc(part) + '</mark>' : esc(part)).join('');
}

/* ----- sidebar search (Blocks / TEs / Items / Entities) ----- */
function sideSearchHTML(key, total) {
  const v = catSearch[key] || '';
  return `<input id="catSearch" class="side-search" type="search" autocomplete="off" spellcheck="false"
            placeholder="Search ${CAT_NOUN[key] || key}…" value="${esc(v)}">
          <div id="sideCount" class="side-count">${sideCountText(key, total)}</div>`;
}
function sideCountText(key, total) {
  const q = (catSearch[key] || '').trim();
  if (!q) return `${total} ${CAT_NOUN[key] || key}`;
  const n = (S[key] || []).filter(o => matchQuery(entryHaystack(o), q)).length;
  return `${n} / ${total} match`;
}
function bindSidebarSearch(side) {
  const inp = side.querySelector('#catSearch');
  if (!inp) return;
  const key = tab;
  const refresh = () => {
    const list = side.querySelector('#sideList');
    const cnt = side.querySelector('#sideCount');
    if (list) list.innerHTML = renderSidebarList(S[key]);
    if (cnt) cnt.textContent = sideCountText(key, S[key].length);
  };
  inp.addEventListener('input', () => { catSearch[key] = inp.value; refresh(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const first = side.querySelector('#sideList [data-sel]');
      if (first) { sel = +first.dataset.sel; draw(); }
    } else if (e.key === 'Escape' && inp.value) {
      inp.value = ''; catSearch[key] = ''; refresh(); e.stopPropagation();
    }
  });
}

/* ----- global search ----- */
const GS_LIMIT = 8;
let gsFlat = [];
let gsActive = -1;
let gsTimer = null;

function gsScore(label, terms) {
  const l = label.toLowerCase();
  const q = terms.join(' ');
  if (l === q) return 0;
  if (l.startsWith(q)) return 1;
  if (l.includes(q)) return 2;
  return 3;
}
function gsCollect(q) {
  const terms = queryTerms(q);
  const groups = [];
  const rank = (arr) => arr.sort((a, b) => a.score - b.score || a.label.localeCompare(b.label, undefined, { sensitivity:'base', numeric:true }));

  for (const kind of ['blocks', 'tes', 'items', 'ents']) {
    const hits = [];
    (S[kind] || []).forEach((o, i) => {
      if (!matchQuery(entryHaystack(o), q)) return;
      const label = labelOf(o);
      hits.push({ kind, index: i, label, score: gsScore(label, terms),
                  sub: (o.sourcePath || '').replace(/^src\/main\/java\//, '') });
    });
    if (hits.length) groups.push({ kind, title: TABS[kind], total: hits.length, hits: rank(hits) });
  }

  const pathKinds = [
    ['mixins', [...(S.mixins || []), ...(S.coremods || [])]],
    ['ieeps',  S.ieeps || []],
    ['raw',    S.raw || []],
  ];
  for (const [kind, arr] of pathKinds) {
    const hits = [];
    const seen = new Set();
    for (const o of arr) {
      if (!o.path || seen.has(o.path)) continue;
      seen.add(o.path);
      if (!matchQuery(entryHaystack(o), q)) continue;
      const label = o.path.split('/').pop();
      hits.push({ kind, path: o.path, label, score: gsScore(label, terms),
                  sub: o.path.replace(/^src\/main\/java\//, '') });
    }
    if (hits.length) groups.push({ kind, title: TABS[kind], total: hits.length, hits: rank(hits) });
  }

  if (textureIndex && textureIndex.all.length) {
    const hits = [];
    for (const t of textureIndex.all) {
      if (!matchQuery(t.path.toLowerCase(), q)) continue;
      const label = t.basename + '.' + t.ext;
      hits.push({ kind:'textures', path: t.path, label, score: gsScore(t.basename, terms),
                  sub: t.folder + '/' + t.subpath });
    }
    if (hits.length) groups.push({ kind:'textures', title: TABS.textures, total: hits.length, hits: rank(hits) });
  }
  return { groups, terms };
}
function gsRender(q) {
  const box = document.getElementById('gsResults');
  const { groups, terms } = gsCollect(q);
  gsFlat = []; gsActive = -1;
  if (!groups.length) {
    box.innerHTML = `<div class="gs-empty">No results for “${esc(q)}”.</div>`;
    box.classList.add('open');
    return;
  }
  let h = '';
  for (const g of groups) {
    h += `<div class="gs-group">${esc(g.title)} · ${g.total}</div>`;
    for (const r of g.hits.slice(0, GS_LIMIT)) {
      const idx = gsFlat.push(r) - 1;
      const thumb = r.kind === 'textures'
        ? `<img class="gs-thumb" loading="lazy" src="${esc(rawUrl(r.path))}" data-repo-path="${esc(r.path)}" alt="" onerror="this.style.opacity=.25">` : '';
      h += `<div class="gs-item" role="option" data-gsi="${idx}">${thumb}
        <div class="gs-main"><div class="gs-label">${hl(r.label, terms)}</div>
        ${r.sub ? `<div class="gs-sub">${hl(r.sub, terms)}</div>` : ''}</div></div>`;
    }
    if (g.total > GS_LIMIT) {
      const idx = gsFlat.push({ kind:'more', target:g.kind, query:q }) - 1;
      h += `<div class="gs-item gs-more" data-gsi="${idx}">See all ${g.total} in ${esc(g.title)} →</div>`;
    }
  }
  box.innerHTML = h;
  box.classList.add('open');
  gsSetActive(0);
}
function gsSetActive(i) {
  const box = document.getElementById('gsResults');
  if (!gsFlat.length) { gsActive = -1; return; }
  gsActive = (i + gsFlat.length) % gsFlat.length;
  box.querySelectorAll('.gs-item.active').forEach(el => el.classList.remove('active'));
  const el = box.querySelector(`[data-gsi="${gsActive}"]`);
  if (el) { el.classList.add('active'); el.scrollIntoView({ block:'nearest' }); }
}
function gsClose() {

  gsActive = -1;
}
function gsActivate(r) {
  if (!r) return;
  gsClose();
  if (r.kind === 'more') {
    if (r.target === 'textures') { textureSearch = r.query; textureFolderFilter = 'all'; }
    else catSearch[r.target] = r.query;
    tab = r.target; sel = 0; draw();
    return;
  }
  if (r.kind === 'textures') { openTextureModal(r.path); return; }
  if (['blocks', 'tes', 'items', 'ents'].includes(r.kind)) {
    catSearch[r.kind] = '';
    tab = r.kind; sel = r.index; draw();
    const b = document.querySelector(`#side [data-sel="${sel}"]`);
    if (b) b.scrollIntoView({ block:'nearest' });

  }

}
(function initGlobalSearch() {
  const inp = document.getElementById('globalSearch');
  const box = document.getElementById('gsResults');
  const hint = document.getElementById('gsHint');
  const run = () => {
    const q = inp.value.trim();
    if (!q) { gsClose(); return; }
    gsRender(q);
  };
  inp.addEventListener('input', () => { clearTimeout(gsTimer); gsTimer = setTimeout(run, 90); });
  inp.addEventListener('focus', () => { hint.style.display = 'none'; if (inp.value.trim()) run(); });
  inp.addEventListener('blur', () => { hint.style.display = inp.value ? 'none' : ''; });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!box.classList.contains('open')) run(); else gsSetActive(gsActive + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); gsSetActive(gsActive - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); if (gsFlat[gsActive]) gsActivate(gsFlat[gsActive]); }
    else if (e.key === 'Escape') {
      if (box.classList.contains('open')) gsClose(); else { inp.value = ''; inp.blur(); }
      e.stopPropagation();
    }
  });
  box.addEventListener('mousedown', e => {
    const el = e.target.closest('[data-gsi]');
    if (!el) return;
    e.preventDefault();
    gsActivate(gsFlat[+el.dataset.gsi]);
  });
  box.addEventListener('mousemove', e => {
    const el = e.target.closest('[data-gsi]');
    if (el && +el.dataset.gsi !== gsActive) gsSetActive(+el.dataset.gsi);
  });
  document.addEventListener('mousedown', e => {
    if (!document.getElementById('gsWrap').contains(e.target)) gsClose();
  });
  document.addEventListener('keydown', e => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    const typing = /INPUT|TEXTAREA|SELECT/.test(tag) || (document.activeElement && document.activeElement.isContentEditable);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault(); inp.focus(); inp.select();
    } else if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) {

    }
  });
})();

const fileNav = { stack: [], cur: null };
const JAVA_STMT_WORDS = new Set(['return','new','throw','else','case','assert','import','package','goto','do','yield','instanceof','extends','implements']);
const JAVA_MODIFIERS = new Set(['public','protected','private','static','final','abstract','synchronized','native','default','transient','volatile','strictfp']);
let _fileSet = null, _fileSetFor = null;
function fileSet() { if (_fileSetFor !== fileList) { _fileSet = new Set(fileList); _fileSetFor = fileList; } return _fileSet; }
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const baseName = p => p.split('/').pop().replace(/\.java$/, '');
const badType = t => !t || JAVA_STMT_WORDS.has(t) || JAVA_MODIFIERS.has(t);
function cleanType(t) {
  if (!t) return null;
  let x = t.replace(/<[^<>]*(?:<[^<>]*>[^<>]*)*>/g, '').replace(/\[\]|\.\.\./g, '').trim();
  x = x.split('.').pop();
  return (!x || x === 'var') ? null : x;
}
function commonPrefixLen(a, b) { let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return i; }

function updateBackBtn() {
  const b = document.getElementById('fileModalBack');
  if (b) b.style.display = fileNav.stack.length ? '' : 'none';
}

function findDeclarations(txt, name) {
  const N = escRe(name);
  const mods = '(?:(?:public|protected|private|static|final|abstract|synchronized|native|default|transient|volatile|strictfp)\\s+)*';
  const ann = '(?:@\\w+(?:\\([^)]*\\))?\\s+)*';
  const T = '([\\w.$]+(?:<[^;(){}=]*>)?(?:\\[\\])*)';
  const reClass  = new RegExp('^\\s*' + ann + mods + '(?:class|interface|enum|@interface)\\s+' + N + '\\b');
  const reMethod = new RegExp('^\\s*' + ann + mods + '(?:<[^>]+>\\s+)?' + T + '\\s+' + N + '\\s*\\(');
  const reCtor   = new RegExp('^\\s*' + ann + mods + N + '\\s*\\(');
  const reField  = new RegExp('^\\s*' + ann + mods + T + '\\s+(?:[\\w$]+\\s*(?:=[^,;]*)?,\\s*)*' + N + '\\s*(?:=|;|,)');
  const out = [];
  const lines = txt.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    if (!ln.includes(name)) continue;
    const t = ln.trim();
    if (!t || t.startsWith('//') || t.startsWith('*') || t.startsWith('/*')) continue;
    let m;
    if (reClass.test(ln)) out.push({ line: i + 1, kind: 'class', text: t });
    else if ((m = ln.match(reMethod)) && !badType(m[1])) out.push({ line: i + 1, kind: 'method', text: t, type: m[1] });
    else if (/^[A-Z]/.test(name) && reCtor.test(ln) && !t.endsWith(';')) out.push({ line: i + 1, kind: 'constructor', text: t });
    else if ((m = ln.match(reField)) && !badType(m[1])) out.push({ line: i + 1, kind: 'field', text: t, type: m[1] });
  }
  return out;
}
function findLocalDecl(lines, name, lineNo) {
  const N = escRe(name);
  const reLocal = new RegExp('^\\s*(?:for\\s*\\(\\s*)?(?:final\\s+)?([\\w.$]+(?:<[^;(){}=]*>)?(?:\\[\\])*)\\s+(?:[\\w$]+\\s*(?:=[^,;]*)?,\\s*)*' + N + '\\s*(?:=|;|,|:)');
  const reParam = new RegExp('[(,]\\s*(?:final\\s+)?(?:@\\w+\\s+)?([\\w.$]+(?:<[^()]*>)?(?:\\[\\])*(?:\\.\\.\\.)?)\\s+' + N + '\\s*(?=[,)])');
  for (let i = Math.min(lineNo, lines.length) - 1; i >= 0; i--) {
    const ln = lines[i];
    if (!ln.includes(name)) continue;
    const t = ln.trim();
    if (t.startsWith('//') || t.startsWith('*') || t.startsWith('/*')) continue;
    let m = ln.match(reLocal);
    if (m && !badType(m[1])) return { line: i + 1, kind: 'variable', text: t, type: m[1] };
    m = ln.match(reParam);
    if (m && !badType(m[1])) return { line: i + 1, kind: 'parameter', text: t, type: m[1] };
  }
  return null;
}
function superNames(txt, cls) {

  if (!m) return [];
  const head = m[0].replace(/<[^<>]*(?:<[^<>]*>[^<>]*)*>/g, '');
  const out = [];
  const ex = head.match(/\bextends\s+([^{]*?)(?:\bimplements\b|\{)/);
  const im = head.match(/\bimplements\s+([^{]*)\{/);

    for (const n of part.split(',')) { const nm = n.trim().split('.').pop(); if (nm) out.push(nm); }
  }

}
function resolveClassPath(name, fromPath, txt) {
  txt = txt || files[fromPath] || '';
  const imps = extractImports(txt);
  for (const imp of imps) if (imp.endsWith('.' + name) && fqnIndex[imp]) return fqnIndex[imp];
  const dir = fromPath.slice(0, fromPath.lastIndexOf('/') + 1);
  if (fileSet().has(dir + name + '.java')) return dir + name + '.java';
  for (const imp of imps) if (imp.endsWith('.*')) { const p = fqnIndex[imp.slice(0, -1) + name]; if (p) return p; }

  if (c && c.length) return c.slice().sort((a, b) => commonPrefixLen(b, fromPath) - commonPrefixLen(a, fromPath))[0];

}

  const p = resolveClassPath(name, fromPath, txt);
  if (!p) return [];
  const t = await ensureSourceLoaded(p);
  const d = t ? findDeclarations(t, name).find(x => x.kind === 'class') : null;

}
async function findMember(path, name, depth = 0, seen = new Set()) {
  if (seen.has(path) || depth > 6) return [];
  seen.add(path);
  const txt = await ensureSourceLoaded(path);
  if (txt == null) return [];
  const decls = findDeclarations(txt, name);
  if (decls.length) return decls.map(d => ({ ...d, path }));
  for (const sup of superNames(txt, baseName(path))) {
    const sp = resolveType(sup, path, txt);
    if (!sp) continue;
    const r = await findMember(sp, name, depth + 1, seen);

}

}
async function searchWider(name, fromPath, txt) {

  const imported = [...new Set(extractImports(txt).map(i => fqnIndex[i]).filter(Boolean))].slice(0, 25);

  for (const p of imported) if (typeof files[p] === 'string') push(p, files[p]);
  if (out.length) return out;
  for (const [p, t] of Object.entries(files)) {

async function resolveSymbol(span, viewer) {

  const lines = txt.split('\n');
  const c = span.closest('.code-content');
  const lineNo = c ? (+c.dataset.ln || 1) : 1;
  const prefix = prefixBefore(span);
  const isCall = span.classList.contains('tok-function');

  const isClassTok = span.classList.contains('tok-type') && !looksConst;
  const q = (prefix.match(/([A-Za-z_$][\w$]*)\s*\.\s*$/) || [])[1];

    if (pk && pk.classList.contains('show')) { hideSymPicker(); return; }
    if (modalOpen) modal.hidden = true;
  } else if (e.altKey && e.key === 'ArrowLeft' && modalOpen) {
    e.preventDefault(); fileModalBack();
  }
});
document.getElementById('fileModalBack').addEventListener('click', fileModalBack);

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.id === 'exploreBtn') { explore(); return; }

  if (t.dataset && t.dataset.cachedload) {
    loadFromCache(t.dataset.cachedload);
    return;
  }
  if (t.dataset && t.dataset.cacheddelete) {
    (async () => {
      try {
        await dbDelete(t.dataset.cacheddelete);
        log(`Deleted cache: ${t.dataset.cacheddelete}`);
        await updateCachedCount();
        openCachedModal();
      } catch (err) { log('Delete failed: ' + err.message, 'err'); }
    })();
    return;
  }
  if (t.dataset && t.dataset.cachedrefresh) {
    (async () => {
      try {
        const rec = await dbGet(t.dataset.cachedrefresh);
        if (!rec) return;
        $('#repoUrl').value = `https://github.com/${rec.meta.owner}/${rec.meta.repo}/tree/${rec.meta.branch}`;
        closeCachedModal();
        explore();
      } catch (err) { log('Refresh failed: ' + err.message, 'err'); }
    })();
    return;
  }

  const texTile = t.closest('[data-texpath]');
  if (texTile) { openTextureModal(texTile.dataset.texpath); return; }

  const chip = t.closest('[data-relatedpath]');
  if (chip) { showFileModal(chip.dataset.relatedpath); return; }

  if (t.dataset && t.dataset.sortmode) {
    sidebarSort = t.dataset.sortmode;
    saveSidebarSort();
    draw();
    return;
  }

  if (t.dataset && t.dataset.act === 'browseTextures') {
    tab = 'textures';
    sel = 0;
    draw();
    return;
  }

  if (t.dataset && t.dataset.tab) { tab = t.dataset.tab; sel = 0; draw(); return; }
  if (t.dataset && t.dataset.sel) { sel = +t.dataset.sel; draw(); return; }

  if (t.dataset && t.dataset.act) {
    const act = t.dataset.act;
    if (act === 'del') {
      if (Array.isArray(S[tab]) && S[tab][sel]) {
        const removed = S[tab][sel];
        log(`Deleted: ${removed.name || removed.className} from ${TABS[tab]}`);
        if (removed.sourcePath) textureCache.delete(removed.sourcePath);
        S[tab].splice(sel, 1); sel = Math.max(0, sel - 1);
        relationIndex = null;
        draw();
      }
    } else if (act === 'copySrc') {
      const v = t.closest('.code-viewer');
      const path = v && v.dataset.srcPath;
      if (path) {
        const txt = files[path] || '';
        navigator.clipboard.writeText(txt)
          .then(() => log('Source copied.', 'ok'))
          .catch(err => log('Copy failed: ' + err.message, 'err'));
      }
    } else if (act === 'refreshSrc') {
      const v = t.closest('.code-viewer');
      const path = v && v.dataset.srcPath;
      if (path) { delete files[path]; loadSourceIntoViewer(v); log(`Refreshed source: ${path}`); }
    } else if (act === 'foldAll') {
      const v = t.closest('.code-viewer');
      if (v) v.querySelectorAll('.code-region').forEach(r => r.classList.add('folded'));
    } else if (act === 'unfoldAll') {
      const v = t.closest('.code-viewer');
      if (v) v.querySelectorAll('.code-region').forEach(r => r.classList.remove('folded'));
    }
    return;
  }

  const head = t.closest('.code-region-head');
  if (head) {
    const region = head.closest('.code-region');
    if (region) region.classList.toggle('folded');
    return;
  }

  if (t.id === 'saveBtn') {
    log('Save: downloading model JSON');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
    a.download = (S.mod.id || 'gtnh-mod') + '.explorer.json';
    a.click();
    return;
  }
  if (t.id === 'openBtn') { $('#openFile').click(); return; }
});

document.addEventListener('change', async e => {
  if (e.target.id !== 'openFile' || !e.target.files[0]) return;
  const f = e.target.files[0]; e.target.value = '';
  try {
    const d = JSON.parse(await f.text());
    if (d.mod && Array.isArray(d.blocks)) {
      S = d;
      relationIndex = null;
      textureCache.clear();
      setStatus('Model loaded. (Re-explore to load textures.)', 'warn');
      log(`Model loaded from file: ${f.name} — textures require re-explore`, 'warn');
      draw();
    } else throw new Error('Not a GTNH Mod Explorer model');
  } catch (err) {
    setStatus('Could not open model: ' + err.message, 'err');
    log('Open model failed: ' + err.message, 'err');
  }
});

/* ============================================================
   INIT
   ============================================================ */
loadSettings();
loadSidebarSort();
applySettings();
updateCachedCount();
log('GTNH Mod Explorer ready.', 'ok');
if (!dbSupported) log('IndexedDB unavailable — caching disabled.', 'warn');
draw();
</script>
<script>
/* Disclaimer gate: the rest of the page is inert until the user acknowledges. */
(function () {
  const d = document.getElementById('disclaimer');
  const ok = document.getElementById('disclaimerOk');
  if (!d || !ok) return;
  const others = [...document.body.children].filter(el => el !== d && el.tagName !== 'SCRIPT');
  others.forEach(el => { el.inert = true; });
  ok.addEventListener('click', () => {
    others.forEach(el => { el.inert = false; });
    d.remove();
  });
  ok.focus();
})();
</script>
